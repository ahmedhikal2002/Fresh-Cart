<svg width="240" height="210" viewBox="0 0 120 105" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FreshCart Icon</title>

  <!-- motion / speed lines -->
  <g fill="#10b981">
    <rect x="4" y="36" width="38" height="8" rx="4"/>
    <rect x="14" y="50" width="28" height="8" rx="4"/>
    <rect x="24" y="64" width="18" height="8" rx="4"/>
  </g>

  <!-- handle -->
  <rect x="40" y="25" width="24" height="9" rx="4.5" fill="#10b981"/>
  <line x1="64" y1="29.5" x2="78" y2="50" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>

  <!-- basket outline -->
  <path d="M78,50 L112,50 L104,84 L58,84 Z" fill="none" stroke="#10b981"
        stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- leaf with knocked-out vein -->
  <path fill-rule="evenodd" fill="#10b981"
        d="M104,54 C90,50 78,58 68,82 C82,74 96,66 104,54 Z
           M100,56 L98,54 C90,63 79,70 67,79 L69,81 C81,73 93,65 100,56 Z"/>

  <!-- wheels -->
  <circle cx="66" cy="92" r="7" fill="#10b981"/>
  <circle cx="96" cy="92" r="7" fill="#10b981"/>
</svg>
