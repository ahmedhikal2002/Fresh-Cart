<ng-container>
  <div class="flex justify-center mb-6">

      class="w-32 h-32 rounded-full bg-gray-50 dark:bg-slate-800 flex items-center justify-center"
    >
      <svg
        class="w-16 h-16 text-gray-300 dark:text-slate-600"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.5"
          d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
        />
      </svg>
    </div>

  <!-- Title -->
  <h2 class="text-xl text-center font-semibold text-gray-800 dark:text-white">{{ title() }}</h2>
</ng-container>
