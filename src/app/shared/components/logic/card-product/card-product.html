<div
  class="group relative w-full rounded-xl bg-white transition-transform duration-300 dark:bg-slate-900 border border-gray-200 dark:border-slate-800 p-4 shadow-sm hover:-translate-y-1 hover:shadow-lg dark:hover:border-slate-700"
>
  <!-- Wishlist -->
  <button
    (click)="wishListToggle(product())"
    [disabled]="wishListService.addToWishlistDisabled() === product()._id"
    type="button"
    aria-label="Add to wishlist"
    class="absolute right-4 top-4 z-10 flex h-9 w-9 items-center justify-center rounded-full bg-white/90 text-gray-500 shadow-sm hover:scale-105 hover:text-red-500 dark:bg-slate-800/90 dark:text-slate-400 dark:hover:text-red-400 backdrop-blur"
  >
    @if (wishListService.isInWishlist(product()._id)) {
      <i class="fa-solid fa-heart text-lg text-red-500"></i>
    } @else {
      <i class="fa-regular fa-heart text-lg"></i>
    }
  </button>

  <a [routerLink]="['/product', product()._id]" class="block">
    <!-- Image -->
    <div class="flex h-52 items-center justify-center overflow-hidden rounded-lg">
      <img
        [src]="product().imageCover"
        [alt]="product().title"
        loading="lazy"
        class="h-full w-full object-contain transition-transform duration-300 group-hover:scale-105"
      />
    </div>

    <!-- Category -->
    <p
      class="mt-4 w-fit rounded-md bg-main-color/10 px-2.5 py-1 text-xs font-medium text-main-color dark:bg-main-color/20 dark:text-main-color"
    >
      {{ product().category.name }}
    </p>

    <!-- Title -->
    <h3
      class="mt-2 min-h-12 line-clamp-2 text-base font-semibold leading-6 text-gray-900 dark:text-white"
    >
      {{ product().title | productTitle }}
    </h3>

    <!-- Rating -->
    <div class="mt-2 flex items-center gap-1.5">
      <div class="flex items-center gap-0.5 text-yellow-400 dark:text-yellow-300">
        @for (star of [1, 2, 3, 4, 5]; track star) {
          @if (star <= product().ratingsAverage) {
            <i class="fa-solid fa-star text-sm"></i>
          } @else {
            <i class="fa-regular fa-star text-sm text-gray-300 dark:text-slate-600"></i>
          }
        }
      </div>

      <span class="text-sm font-medium text-gray-700 dark:text-slate-300">
        {{ product().ratingsAverage }}
      </span>

      <span class="text-xs text-gray-400 dark:text-slate-500">
        ({{ product().ratingsQuantity }})
      </span>
    </div>

    <!-- Price -->
    <span class="mt-3 block text-lg font-bold text-gray-900 dark:text-white">
      {{ product().price | currency: 'EGP' : 'symbol-narrow' }}
    </span>
  </a>

  <!-- Add To Cart -->
  <button
    type="button"
    [disabled]="addToCartDisabled() === product()._id"
    (click)="addToCart(product())"
    class="group/btn mt-4 flex w-full items-center justify-center gap-2 rounded-lg bg-slate-900 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 hover:shadow-md active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:scale-100 disabled:hover:bg-slate-900 disabled:hover:shadow-sm dark:bg-white dark:text-slate-900 dark:hover:bg-slate-100 dark:disabled:hover:bg-white"
  >
    @if (addToCartDisabled() === product()._id) {
      <i class="fa-solid fa-spinner fa-spin"></i>
      <span>Adding...</span>
    } @else {
      <i
        class="fa-solid fa-cart-shopping transition-transform duration-300 group-hover/btn:-translate-y-0.5"
      ></i>
      <span>Add to Cart</span>
    }
  </button>
</div>
