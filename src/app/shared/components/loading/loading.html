@if (loadingService.isLoading()) {
  <div
    class="fixed inset-0 z-99999 flex flex-col items-center justify-center bg-white/80 dark:bg-slate-950/80 backdrop-blur-md"
  >
    <img
      width="100"
      height="100"
      src="/icons/Shopping Cart Icon Animation.svg"
      alt="loading icon"
    />

    <p class="mt-4 text-lg font-bold text-gray-700 dark:text-gray-200 animate-pulse">Loading...</p>
  </div>
}
