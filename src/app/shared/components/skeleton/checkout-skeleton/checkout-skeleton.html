<div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
  <!-- Form skeleton (2/3) -->
  <div
    class="space-y-5 rounded-2xl border border-gray-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900 lg:col-span-2"
  >
    <!-- Title -->
    <div class="skeleton h-6 w-48 rounded"></div>

    <!-- 4 Inputs -->
    @for (i of [1, 2, 3, 4]; track i) {
      <div class="space-y-2">
        <!-- Label -->
        <div class="skeleton h-4 w-24 rounded"></div>

        <!-- Input -->
        <div class="skeleton h-12 w-full rounded-xl"></div>
      </div>
    }

    <!-- Payment methods title -->
    <div class="skeleton mt-8 h-6 w-40 rounded"></div>

    <!-- Payment methods -->
    <div class="grid grid-cols-2 gap-4">
      <div class="skeleton h-20 rounded-xl"></div>
      <div class="skeleton h-20 rounded-xl"></div>
    </div>

    <!-- Button -->
    <div class="skeleton mt-8 h-12 w-full rounded-xl"></div>
  </div>

  <!-- Summary skeleton (1/3) -->
  <div
    class="space-y-4 h-44.5 rounded-2xl border border-gray-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900"
  >
    <!-- Title -->
    <div class="skeleton h-6 w-40 rounded"></div>

    <!-- Summary lines -->
    <div class="skeleton h-4 w-full rounded"></div>

    <div class="skeleton h-4 w-full rounded"></div>

    <!-- Total -->
    <div class="skeleton mt-6 h-8 w-32 rounded"></div>
  </div>
</div>
