<!-- Rating Summary Skeleton -->
<div
  class="mb-3 ml-auto hidden w-fit items-center gap-3 rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 dark:border-slate-800 dark:bg-slate-900 sm:flex"
>
  <!-- Rating number -->
  <div class="skeleton h-6 w-8 rounded"></div>

  <div>
    <!-- Stars -->
    <div class="flex items-center gap-1">
      @for (star of [1, 2, 3, 4, 5]; track star) {
        <div class="skeleton h-3.5 w-3.5 rounded"></div>
      }
    </div>

    <!-- Reviews count -->
    <div class="skeleton mt-2 h-3 w-12 rounded"></div>
  </div>
</div>

<!-- Reviews Header -->
<div class="mb-2 flex items-center justify-between">
  <div class="skeleton h-4 w-32 rounded"></div>

  <div class="skeleton h-4 w-24 rounded"></div>
</div>

<!-- Reviews -->
<div class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3">
  @for (item of [1, 2, 3, 4, 5, 6]; track item) {
    <div
      class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-900"
    >
      <!-- User -->
      <div class="flex items-center gap-3">
        <!-- Avatar -->
        <div class="skeleton h-11 w-11 rounded-full"></div>

        <div class="flex-1">
          <!-- Name -->
          <div class="skeleton h-4 w-28 rounded"></div>

          <!-- Date -->
          <div class="skeleton mt-2 h-3 w-20 rounded"></div>
        </div>
      </div>

      <!-- Rating -->
      <div class="mt-4 flex items-center gap-1">
        @for (star of [1, 2, 3, 4, 5]; track star) {
          <div class="skeleton h-4 w-4 rounded"></div>
        }
      </div>

      <!-- Review title -->
      <div class="skeleton mt-4 h-4 w-3/4 rounded"></div>

      <!-- Review content -->
      <div class="mt-3 space-y-2">
        <div class="skeleton h-3 w-full rounded"></div>
        <div class="skeleton h-3 w-11/12 rounded"></div>
        <div class="skeleton h-3 w-2/3 rounded"></div>
      </div>
    </div>
  }
</div>
