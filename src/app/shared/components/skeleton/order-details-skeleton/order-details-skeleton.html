<section>
  <!-- ===== Header Card Skeleton ===== -->
  <div
    class="mb-6 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900"
  >
    <div class="flex flex-wrap items-start justify-between gap-4 p-6">
      <!-- Left: Order ID + Date -->
      <div class="space-y-3">
        <div class="skeleton h-3 w-16 rounded"></div>
        <div class="skeleton h-7 w-48 rounded"></div>
        <div class="skeleton h-4 w-40 rounded"></div>
      </div>

      <!-- Right: Status badges -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="skeleton h-8 w-20 rounded-full"></div>
        <div class="skeleton h-8 w-24 rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- ===== Info Grid Skeleton ===== -->
  <div class="mb-6 grid grid-cols-1 gap-4 md:grid-cols-2">
    <!-- Shipping Address -->
    <div
      class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900"
    >
      <!-- Header -->
      <div class="mb-4 flex items-center gap-3">
        <div class="skeleton h-10 w-10 rounded-lg"></div>

        <div class="space-y-2">
          <div class="skeleton h-4 w-32 rounded"></div>
          <div class="skeleton h-3 w-24 rounded"></div>
        </div>
      </div>

      <!-- Lines -->
      <div class="space-y-3">
        @for (item of [1, 2, 3, 4]; track $index) {
          <div class="flex items-center gap-2">
            <div class="skeleton h-4 w-4 shrink-0 rounded"></div>

            <div class="skeleton h-3.5 rounded" [style.width.%]="50 + (($index * 12) % 40)"></div>
          </div>
        }
      </div>
    </div>

    <!-- Payment Method -->
    <div
      class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900"
    >
      <!-- Header -->
      <div class="mb-4 flex items-center gap-3">
        <div class="skeleton h-10 w-10 rounded-lg"></div>

        <div class="space-y-2">
          <div class="skeleton h-4 w-32 rounded"></div>
          <div class="skeleton h-3 w-20 rounded"></div>
        </div>
      </div>

      <!-- Payment info -->
      <div class="flex items-center gap-3">
        <div class="skeleton h-8 w-8 shrink-0 rounded"></div>

        <div class="flex-1 space-y-2">
          <div class="skeleton h-4 w-40 rounded"></div>
          <div class="skeleton h-3 w-28 rounded"></div>
        </div>
      </div>

      <!-- Confirmation -->
      <div class="mt-3 flex items-center gap-2 border-t border-gray-100 pt-3 dark:border-slate-800">
        <div class="skeleton h-4 w-4 rounded-full"></div>
        <div class="skeleton h-3 w-32 rounded"></div>
      </div>
    </div>
  </div>

  <!-- ===== Order Items Skeleton ===== -->
  <div
    class="mb-6 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900"
  >
    <!-- Header -->
    <div class="flex items-center gap-3 border-b border-gray-100 px-6 py-4 dark:border-slate-800">
      <div class="skeleton h-10 w-10 rounded-lg"></div>

      <div class="space-y-2">
        <div class="skeleton h-4 w-28 rounded"></div>
        <div class="skeleton h-3 w-16 rounded"></div>
      </div>
    </div>

    <!-- Items -->
    <div class="divide-y divide-gray-100 dark:divide-slate-800">
      @for (item of [1, 2]; track $index) {
        <div class="p-5">
          <div class="flex items-center gap-4">
            <!-- Image -->
            <div class="skeleton h-20 w-20 shrink-0 rounded-xl"></div>

            <!-- Info -->
            <div class="min-w-0 flex-1 space-y-2">
              <div class="skeleton h-3 w-20 rounded"></div>

              <div class="skeleton h-4 w-full max-w-xs rounded"></div>

              <div class="skeleton h-3 w-24 rounded"></div>
            </div>

            <!-- Price -->
            <div class="shrink-0 space-y-2 text-right">
              <div class="skeleton ml-auto h-3 w-20 rounded"></div>
              <div class="skeleton ml-auto h-4 w-24 rounded"></div>
              <div class="skeleton ml-auto h-3 w-16 rounded"></div>
            </div>
          </div>

          <!-- Review Box -->
          <div
            class="mt-6 rounded-xl border border-dashed border-gray-300 bg-gray-50 p-5 dark:border-slate-700 dark:bg-slate-900/50"
          >
            <div class="flex flex-col items-center gap-3">
              <div class="skeleton h-11 w-11 rounded-full"></div>

              <div class="skeleton h-4 w-48 rounded"></div>

              <div class="skeleton h-3 w-56 rounded"></div>

              <div class="skeleton mt-1 h-9 w-32 rounded-lg"></div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- ===== Order Summary Skeleton ===== -->
  <div
    class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900"
  >
    <!-- Header -->
    <div class="flex items-center gap-3 border-b border-gray-100 px-6 py-4 dark:border-slate-800">
      <div class="skeleton h-10 w-10 rounded-lg"></div>

      <div class="space-y-2">
        <div class="skeleton h-4 w-28 rounded"></div>
        <div class="skeleton h-3 w-20 rounded"></div>
      </div>
    </div>

    <!-- Rows -->
    <div class="space-y-4 p-6">
      @for (item of [1, 2, 3]; track $index) {
        <div class="flex items-center justify-between">
          <div class="skeleton h-3.5 w-20 rounded"></div>
          <div class="skeleton h-3.5 w-24 rounded"></div>
        </div>
      }

      <!-- Total -->
      <div
        class="flex items-center justify-between border-t border-gray-100 pt-4 dark:border-slate-800"
      >
        <div class="skeleton h-5 w-16 rounded"></div>
        <div class="skeleton h-7 w-32 rounded"></div>
      </div>
    </div>
  </div>
</section>
