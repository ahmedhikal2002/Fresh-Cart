<section
  class="min-h-screen bg-gray-50 dark:bg-gray-950 px-4 py-8 transition-colors duration-300 sm:px-6 lg:px-8"
>
  <div class="max-w-362.5 mx-auto">
    <!-- ================= Header ================= -->
    <div class="mb-8 flex flex-col gap-4 pb-6 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <!-- Title -->
        <div class="flex items-center gap-3">
          <!-- Shopping Cart -->
          <div class="skeleton h-8 w-48 rounded-lg"></div>
        </div>

        <!-- Subtitle -->
        <div class="mt-3 flex items-center gap-2">
          <div class="skeleton h-1.5 w-1.5 rounded-full"></div>

          <div class="skeleton h-4 w-64 rounded"></div>
        </div>
      </div>

      <!-- Items Badge + Clear -->
      <div class="flex items-center gap-3">
        <div class="skeleton h-10 w-20 rounded-lg"></div>

        <div class="skeleton h-9 w-9 rounded-lg"></div>
      </div>
    </div>

    <!-- ================= Cart Content ================= -->
    <div class="grid grid-cols-1 items-start gap-6 lg:grid-cols-3">
      <!-- ================= Products ================= -->
      <div class="space-y-4 lg:col-span-2">
        @for (item of CartItems; track $index) {
          <article
            class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-5"
          >
            <div class="flex flex-col gap-4 sm:flex-row">
              <!-- ================= Product Image ================= -->
              <div class="skeleton h-32 w-full shrink-0 rounded-xl sm:w-32"></div>

              <!-- ================= Product Info ================= -->
              <div class="min-w-0 flex-1">
                <!-- Title + Remove -->
                <div class="flex items-start justify-between gap-3">
                  <div class="flex-1">
                    <!-- Title -->
                    <div class="space-y-2">
                      <div class="skeleton h-5 w-full max-w-md rounded"></div>

                      <div class="skeleton h-5 w-2/3 max-w-xs rounded"></div>
                    </div>

                    <!-- Category -->
                    <div class="skeleton mt-3 h-4 w-24 rounded"></div>
                  </div>

                  <!-- Remove Button -->
                  <div class="skeleton h-9 w-9 shrink-0 rounded-lg"></div>
                </div>

                <!-- Price -->
                <div class="skeleton mt-4 h-6 w-28 rounded"></div>

                <!-- ================= Bottom ================= -->
                <div
                  class="mt-4 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
                >
                  <!-- Quantity -->
                  <div class="flex items-center gap-3">
                    <!-- Quantity Text -->
                    <div class="skeleton h-4 w-16 rounded"></div>

                    <!-- Quantity Controller -->
                    <div
                      class="flex items-center overflow-hidden rounded-xl border border-gray-200 dark:border-slate-700"
                    >
                      <!-- Minus -->
                      <div class="skeleton h-9 w-9"></div>

                      <!-- Count -->
                      <div class="skeleton h-9 w-10"></div>

                      <!-- Plus -->
                      <div class="skeleton h-9 w-9"></div>
                    </div>
                  </div>

                  <!-- Item Total -->
                  <div class="space-y-2 sm:text-right">
                    <div class="skeleton ml-auto h-3 w-16 rounded"></div>

                    <div class="skeleton ml-auto h-5 w-24 rounded"></div>
                  </div>
                </div>
              </div>
            </div>
          </article>
        }
      </div>

      <!-- ================= Order Summary ================= -->
      <aside
        class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-6"
      >
        <!-- Title -->
        <div class="skeleton h-7 w-40 rounded"></div>

        <!-- ================= Summary ================= -->
        <div class="mt-6 space-y-4">
          <!-- Items -->
          <div class="flex items-center justify-between">
            <div class="skeleton h-4 w-12 rounded"></div>
            <div class="skeleton h-4 w-10 rounded"></div>
          </div>

          <!-- Subtotal -->
          <div class="flex items-center justify-between">
            <div class="skeleton h-4 w-20 rounded"></div>
            <div class="skeleton h-4 w-24 rounded"></div>
          </div>

          <!-- Shipping -->
          <div class="flex items-center justify-between">
            <div class="skeleton h-4 w-20 rounded"></div>
            <div class="skeleton h-4 w-12 rounded"></div>
          </div>
        </div>

        <!-- ================= Divider ================= -->
        <div class="my-6 border-t border-gray-200 dark:border-slate-800"></div>

        <!-- ================= Total ================= -->
        <div class="flex items-center justify-between">
          <div class="skeleton h-6 w-16 rounded"></div>
          <div class="skeleton h-7 w-28 rounded"></div>
        </div>

        <!-- ================= Coupon ================= -->
        <div class="mt-4 flex gap-2">
          <!-- Coupon Input -->
          <div class="skeleton h-10 flex-1 rounded-lg"></div>

          <!-- Apply Button -->
          <div class="skeleton h-10 w-20 rounded-lg"></div>
        </div>

        <!-- ================= Checkout ================= -->
        <div class="skeleton mt-6 h-14 w-full rounded-xl"></div>

        <!-- ================= Continue Shopping ================= -->
        <div class="skeleton mt-3 h-12 w-full rounded-xl"></div>

        <!-- ================= Secure Checkout ================= -->
        <div class="skeleton mx-auto mt-5 h-4 w-28 rounded"></div>
      </aside>
    </div>
  </div>
</section>
