<section>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-3 lg:grid-cols-4">
    @for (product of Products; track $index) {
      <div class="h-115.5 w-full rounded-[5px] bg-gray-100 dark:bg-slate-800">
        <!-- Image -->
        <div class="mx-auto mt-1.5 h-[60%] w-[90%] rounded-xl skeleton"></div>

        <!-- Content -->
        <div class="p-4">
          <!-- Category -->
          <div class="skeleton h-5 w-24 rounded-md"></div>

          <!-- Product name -->
          <div class="skeleton mt-3 h-5 w-32 rounded-md"></div>

          <!-- Price + Rating -->
          <div class="mt-6 flex items-center">
            <div class="skeleton h-5 w-24 rounded-md"></div>

            <div class="skeleton h-5 w-9 rounded-md"></div>
          </div>
          <div class="mt-3 skeleton h-9 w-[98%] mx-auto rounded-md"></div>
        </div>
      </div>
    }
  </div>
</section>
