<!-- products-grid-skeleton.html -->

<!-- Header -->
<div class="flex items-center justify-between">
  <div class="skeleton h-4 w-32 rounded"></div>
  <div class="skeleton h-4 w-24 rounded"></div>
</div>

<!-- Products Grid -->
<div class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-3">
  @for (item of [1, 2, 3, 4, 5, 6]; track $index) {
    @if ($index < cardsCount()) {
      <div
        class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900"
      >
        <!-- Image -->
        <div class="skeleton h-52 w-full"></div>

        <!-- Content -->
        <div class="space-y-3 p-4">
          <!-- Category badge -->
          <div class="skeleton h-5 w-20 rounded-md"></div>

          <!-- Title -->
          <div class="space-y-2">
            <div class="skeleton h-4 w-full rounded"></div>
            <div class="skeleton h-4 w-3/4 rounded"></div>
          </div>

          <!-- Rating -->
          <div class="flex items-center gap-2">
            <div class="skeleton h-3 w-20 rounded"></div>
            <div class="skeleton h-3 w-8 rounded"></div>
          </div>

          <!-- Price -->
          <div class="skeleton h-5 w-24 rounded"></div>

          <!-- Button -->
          <div class="skeleton h-11 w-full rounded-lg"></div>
        </div>
      </div>
    }
  }
</div>
