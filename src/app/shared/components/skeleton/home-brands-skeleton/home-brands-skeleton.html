<div class="flex gap-4 overflow-hidden">
  @for (item of [1, 2, 3, 4, 5, 6]; track $index) {
    <div
      class="h-36 w-[calc(50%-0.5rem)] shrink-0 rounded-xl border border-gray-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-900 sm:w-[calc(33.333%-0.7rem)] md:w-[calc(25%-0.75rem)] lg:w-[calc(16.666%-0.85rem)]"
    >
      <!-- Logo placeholder -->
      <div class="flex h-full w-full items-center justify-center">
        <div class="skeleton h-12 rounded-md" [style.width.%]="50 + (($index * 8) % 40)"></div>
      </div>
    </div>
  }
</div>
