<section class="min-h-screen py-10">
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-1 gap-10 rounded-2xl p-6 shadow-lg lg:grid-cols-2 lg:p-8">
      <!-- ================= Image Skeleton ================= -->
      <div class="skeleton flex h-125 w-full items-center justify-center rounded-2xl">
        <div class="h-3/4 w-3/4 rounded-xl bg-gray-300/50 dark:bg-slate-600/50"></div>
      </div>

      <!-- ================= Product Info Skeleton ================= -->
      <div class="flex flex-col">
        <!-- Category -->
        <div class="skeleton mb-4 h-6 w-32 rounded-full"></div>

        <!-- Title -->
        <div class="space-y-3">
          <div class="skeleton h-10 w-4/5 rounded-lg"></div>
          <div class="skeleton h-10 w-2/3 rounded-lg"></div>
        </div>

        <!-- Brand -->
        <div class="skeleton mt-5 h-5 w-40 rounded"></div>

        <!-- Rating -->
        <div class="mt-6 flex gap-3">
          <div class="skeleton h-5 w-32 rounded"></div>
          <div class="skeleton h-5 w-20 rounded"></div>
        </div>

        <!-- Price -->
        <div class="mt-6 flex gap-4">
          <div class="skeleton h-10 w-36 rounded"></div>
          <div class="skeleton h-7 w-24 rounded"></div>
        </div>

        <!-- Description -->
        <div class="mt-6 space-y-3">
          <div class="skeleton h-6 w-32 rounded"></div>

          <div class="skeleton h-4 w-full rounded"></div>
          <div class="skeleton h-4 w-5/6 rounded"></div>
          <div class="skeleton h-4 w-4/6 rounded"></div>
        </div>

        <!-- Availability -->
        <div class="mt-6 flex gap-10 border-y border-gray-200 py-5 dark:border-gray-700">
          <div class="space-y-2">
            <div class="skeleton h-4 w-20 rounded"></div>
            <div class="skeleton h-6 w-24 rounded"></div>
          </div>

          <div class="space-y-2">
            <div class="skeleton h-4 w-20 rounded"></div>
            <div class="skeleton h-6 w-24 rounded"></div>
          </div>
        </div>

        <!-- Colors -->
        <div class="mt-6">
          <div class="skeleton mb-4 h-5 w-40 rounded"></div>

          <div class="flex gap-3">
            @for (item of [1, 2, 3, 4]; track item) {
              <div class="skeleton h-8 w-8 rounded-full"></div>
            }
          </div>
        </div>

        <!-- Button -->
        <div class="mt-auto pt-8">
          <div class="skeleton h-14 w-full rounded-xl"></div>
        </div>
      </div>
    </div>
  </div>
</section>
